[package]
name = "zphiramp"
description = "Phira multiplayer server (ZENITH event fork), Rust port of jphira-mp."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "zphiramp"
path = "src/main.rs"

[dependencies]
zphira-common = { path = "../common" }
zphira-phira = { path = "../phira" }
zphira-catalog = { path = "../catalog" }
zphira-ledger = { path = "../ledger" }
zphira-game = { path = "../game" }
zphira-http = { path = "../http" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tracing = "0.1.44"
crossterm = "0.29.0"
unicode-width = "0.2.3"

[dev-dependencies]
nix = { version = "0.28", default-features = false, features = ["term"] }
portable-pty = "0.9.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
