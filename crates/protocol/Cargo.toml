[package]
name = "zphira-protocol"
description = "Phira multiplayer wire protocol (port of jphira-mp-protocol 2.2.1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
thiserror = "2.0.21"
tokio-util = { version = "0.7.20", features = ["codec"] }

[dev-dependencies]
futures-util = { version = "0.3.34", features = ["sink"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "time"] }
